name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "mobile-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v0.1.3 or mobile-v0.1.3)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: genmeet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    if: "!startsWith(github.ref, 'refs/tags/mobile-v') && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'))"
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.ref }}".StartsWith("refs/tags/")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.release_tag }}".Trim() -ne "") {
            $tag = "${{ inputs.release_tag }}".Trim()
          } else {
            $vj = Get-Content "version.json" -Raw -Encoding UTF8 | ConvertFrom-Json
            $tag = "v" + ([string]$vj.version).Trim().TrimStart("v")
          }
          $ver = $tag -replace '^(mobile-)?v', ''
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved release tag: $tag (version: $ver)"

      - name: Install dependencies & verify
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run lint
          go vet ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...

      - name: Build Windows Installer Suite & Portable ZIP
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/build-all.ps1 -SkipVersionGen

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GenMeet-windows-amd64
          path: |
            dist/GenMeet-Setup-*.exe
            dist/GenMeet-*-portable-windows-amd64.zip
            installer/GenMeet-Launcher.exe
            installer/GenMeet-Repair.exe
            installer/GenMeet-Updater.exe
            installer/GenMeet-Uninstall.exe

  build-android:
    if: "github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || (!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]')"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve tag & version
        id: meta
        run: |
          VER=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved Android release tag: ${TAG} (version: ${VER})"

      - name: Build Android test APK (minSdk 24 / Android 7.0+ through Android 15)
        working-directory: mobile/android
        run: |
          gradle assembleDebug --no-daemon
          mkdir -p ../../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/GenMeet-android-v${{ steps.meta.outputs.version }}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenMeet-android-apk
          path: dist/GenMeet-android-*.apk

  publish-release:
    needs: [build-windows, build-android]
    if: "always() && needs.build-android.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release title
        id: rel
        run: |
          TAG="${{ needs.build-android.outputs.tag }}"
          if [[ "$TAG" == mobile-* ]]; then
            TITLE="GenMeet Mobile (${TAG#mobile-})"
          else
            TITLE="GenMeet ${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.title }}
          generate_release_notes: true
          files: |
            release-assets/**/*
